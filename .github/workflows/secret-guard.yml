name: secret-guard

# A client key committed here would be public forever. .gitignore stops accidents;
# this stops the deliberate or the careless. Runs on every push and pull request.

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fail on provisioning artefacts
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)(provision\.json|client\.key|.+\.key|.+\.pfx|.+\.p12)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Provisioning artefacts must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "No provisioning artefacts tracked."

      - name: Fail on 64-hex key material
        run: |
          # A client key is 64 lowercase hex characters. SHA256SUMS.txt legitimately
          # contains hashes of that shape, so it is the one file excluded.
          hits=$(git ls-files -z \
            | xargs -0 -r grep -IHnEo '\b[0-9a-f]{64}\b' 2>/dev/null \
            | grep -v '^SHA256SUMS\.txt:' || true)
          if [ -n "$hits" ]; then
            echo "::error::64-hex strings found - check whether a client key leaked:"
            echo "$hits"
            exit 1
          fi
          echo "No 64-hex key material found."
